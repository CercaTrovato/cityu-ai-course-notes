<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CityU · 小组进度看板</title><link rel="stylesheet" href="/assets/board.css"><link rel="stylesheet" href="/assets/online.css"><link rel="stylesheet" href="/assets/thinking.css"><link rel="stylesheet" href="/assets/timeline.css"></head><body>
<header class="app-header"><div class="brand">CityU <span>小组进度 · 只读镜像</span><div id="sync-status"></div></div><div class="account-actions" id="account-actions"><span id="account"></span><button class="quiet-button" id="logout" hidden>退出登录</button><span id="connection"></span></div></header>
<section id="auth-screen" class="auth-screen"><h1>看清本组的任务与下一步</h1><p id="auth-message">正在检查登录…</p><button class="primary" id="login">使用 GitHub 登录</button><div id="auth-options"></div><p class="micro">默认保持登录。首次自选一门课程即可使用，改绑才需总监督处理。组员可查看和下载本组共享资料。</p></section>
<div id="workspace" class="layout" hidden><nav class="sidebar" aria-label="项目导航"><button data-global="overview" class="active">项目总览</button><button data-global="actions">待推动事项</button><button data-global="timeline">项目时间线</button><div class="caption">我的课程</div><div id="courses"></div><footer>课程和文件按成员权限提供。<br>新进展由总监督主动同步。<br>组员无法修改或自行改绑。</footer></nav><div class="content"><div id="errors" role="alert"></div><main id="main"></main></div></div>
<dialog id="detail"><div id="detail-content"></div></dialog>
<aside class="file-panel" id="file-panel" hidden aria-label="资料预览"><header><h2 id="file-title"></h2><small id="file-note"></small><button class="quiet-button" id="file-download">下载原件</button><button class="quiet-button" id="file-expand">展开／收起</button><button class="quiet-button" id="file-close">关闭预览</button></header><div class="file-body" id="file-body"></div></aside>
<dialog id="admin"><button class="quiet-button" id="admin-close">关闭管理</button><div id="admin-content"></div></dialog>
<script type="module" src="/assets/online.js"></script><script defer src="/assets/thinking.js"></script><script defer src="/assets/timeline.js"></script><script defer src="/assets/board.js"></script></body></html>
