<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CityU · 课程行动看板</title>
<style>
:root{--paper:#f4f3ed;--white:#fffefa;--ink:#1e3034;--muted:#647074;--line:#dcded6;--green:#216653;--pale:#e5eee6;--orange:#ab532c;--red:#a73529;--nav:#18383d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;font-size:14px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}a{color:var(--green);text-underline-offset:3px}button{color:inherit}header{padding:20px 36px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--white)}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:1px}.brand span{font:12px "Microsoft YaHei UI",sans-serif;color:var(--muted);letter-spacing:2px;margin-left:17px}.connection{font-size:12px;color:var(--green)}.connection:before{content:"";display:inline-block;width:6px;height:6px;background:currentColor;border-radius:100%;margin-right:8px}.connection.error{color:var(--red)}.shell{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:calc(100vh - 76px)}nav{padding:30px 18px;background:var(--nav);color:#eaf0eb;display:flex;flex-direction:column;gap:6px}.nav-caption{font-size:10px;letter-spacing:2px;color:#a4bbb8;padding:7px 13px 17px}nav button{padding:12px 13px;text-align:left;border:0;background:transparent;border-radius:4px;color:#c6d6d1}nav button.active{background:#315459;color:#fff}nav small{margin-top:auto;padding:32px 13px 10px;color:#a4bbb8;line-height:1.9}main{padding:30px 36px 60px;max-width:1700px;width:100%;margin:auto}.eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--green);text-transform:uppercase}h1{font-size:29px;letter-spacing:-.7px;line-height:1.3;margin:9px 0 12px;font-weight:600}h2{font-size:18px;font-weight:600;margin:0 0 12px}h3{font-size:16px;margin:0 0 5px}.intro{display:flex;justify-content:space-between;gap:30px;align-items:end}.intro p{color:var(--muted);margin:0;max-width:740px;font-size:13px}.stamp{color:var(--muted);font-size:11px;white-space:nowrap;padding-bottom:3px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin:25px 0 27px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.metric{padding:16px 22px 16px 0}.metric+.metric{border-left:1px solid var(--line);padding-left:22px}.metric strong{font-family:Georgia,serif;font-size:29px;font-weight:normal;margin-right:10px}.metric span{font-size:12px;color:var(--muted)}.metric small{display:block;font-size:11px;color:var(--muted)}.focus{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(230px,1fr);border:1px solid #bfccc0;background:var(--pale);margin-bottom:28px}.focus-main{padding:22px 25px}.focus-main h2{font-size:21px;margin:7px 0 8px}.focus-main p{margin:0 0 16px;max-width:700px;font-size:13px}.focus-side{border-left:1px solid #bfccc0;padding:22px 25px;display:flex;flex-direction:column;justify-content:center}.focus-side p{margin:5px 0;font-size:13px}.plain-btn{border:0;border-bottom:1px solid currentColor;padding:0 0 3px;background:transparent;font-size:12px;color:var(--green);width:max-content}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar input{margin-left:auto;background:var(--white);border:1px solid var(--line);padding:8px 12px;border-radius:4px;width:240px}.toolbar select{background:var(--white);padding:8px;border:1px solid var(--line);border-radius:4px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{border:1px solid transparent;background:transparent;border-radius:3px;padding:6px 9px;font-size:12px}.filters button.active{background:var(--ink);color:#fff}.project-list{background:var(--white);border:1px solid var(--line)}.project{display:grid;grid-template-columns:100px minmax(210px,1.5fr) minmax(170px,1fr) 154px 76px;gap:20px;padding:23px;align-items:start;border-bottom:1px solid var(--line)}.project:last-child{border-bottom:0}.course{font-weight:700;font-size:15px;letter-spacing:.4px}.group{font-size:11px;color:var(--muted);margin-top:4px}.title-button{border:0;padding:0;background:transparent;text-align:left;font-size:16px;font-weight:600}.title-button:hover{text-decoration:underline}.summary{font-size:12px;color:var(--muted);margin:7px 0;max-width:500px}.tag{display:inline-block;padding:2px 7px;border:1px solid var(--line);font-size:10px;border-radius:2px;margin:3px 4px 0 0;vertical-align:middle}.tag.warn{color:var(--orange);border-color:#dfc5af;background:#fff6e9}.tag.good{color:var(--green);border-color:#a9c3b4}.field-label{font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:5px}.next{font-size:12px}.deadline{font-family:Georgia,serif;font-size:21px;line-height:1.3}.deadline-label{font-size:11px;color:var(--muted);margin-top:6px}.progress-line{display:flex;height:4px;gap:3px;margin:12px 0 5px}.progress-line i{display:block;background:#e6e8e0;flex:1}.progress-line i.done{background:var(--green)}.progress-line i.in_progress{background:#bd9c5c}.counts{font-size:10px;color:var(--muted)}.details-btn{border:1px solid var(--line);background:transparent;padding:6px 9px;font-size:11px;border-radius:3px}.footer-note{font-size:11px;color:var(--muted);margin:16px 0;line-height:1.9}.alert{padding:12px 18px;border-left:3px solid var(--red);background:#f9e9e3;margin:16px 0;font-size:12px;overflow-wrap:anywhere}.timeline{background:var(--white);border:1px solid var(--line)}.event{display:grid;grid-template-columns:180px 100px 1fr 170px;gap:18px;padding:18px 23px;border-bottom:1px solid var(--line);align-items:center}.event:last-child{border-bottom:0}.event b{font-weight:600}.event small{display:block;color:var(--muted)}.question-row{padding:20px 24px;background:var(--white);border:1px solid var(--line);margin-bottom:12px}.question-row ul{padding-left:18px;font-size:13px;color:var(--muted);margin:8px 0}.empty{padding:35px;color:var(--muted);text-align:center}.hidden{display:none!important}
dialog{border:0;padding:0;background:var(--white);color:var(--ink);width:min(1010px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#0c242bb3}.dialog-head{padding:25px 30px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;position:sticky;top:0;background:var(--white);z-index:1}.dialog-head h2{margin:4px 0}.close{border:1px solid var(--line);background:transparent;height:32px;width:32px;font-size:20px}.dialog-body{padding:25px 30px;display:grid;grid-template-columns:1.5fr 1fr;gap:28px}.dialog-body section{margin-bottom:25px}.dialog-body p{font-size:13px}.task{padding:12px 0;border-bottom:1px solid var(--line)}.task-top{display:flex;align-items:start;gap:10px}.status{font-size:10px;padding:3px 5px;min-width:48px;text-align:center;background:#edf0e9}.status.done{background:var(--pale);color:var(--green)}.status.unknown{color:var(--orange);background:#f7eedf}.status.in_progress{background:#f1ebd7}.task p{font-size:11px;color:var(--muted);margin:4px 0 0 58px}.sources{grid-column:1/-1;border-top:1px solid var(--line);padding-top:20px}.source{font-size:12px;padding:9px 0;border-bottom:1px solid var(--line)}.source code{display:block;font-size:11px;overflow-wrap:anywhere;color:var(--muted);margin-top:3px}.dialog-aside{padding:17px;background:#efefe8;align-self:start}.dialog-aside h3{font-size:13px;margin-top:17px}.dialog-aside ul{padding-left:17px;font-size:12px}.metadata{font-family:Consolas,monospace;font-size:11px;overflow-wrap:anywhere}.evidence-note{color:var(--muted);font-size:11px}.connection button{border:0;background:transparent;text-decoration:underline;font-size:11px;color:inherit;margin-left:10px}
@media(min-width:1600px){main{padding:40px 52px}.project{padding:28px}}@media(max-width:1150px){.shell{grid-template-columns:145px minmax(0,1fr)}main{padding:25px 22px}.project{grid-template-columns:80px 1.4fr 1fr;gap:15px}.project>.date-cell{grid-column:2}.project>.last-cell{grid-column:3}.stamp{display:none}.event{grid-template-columns:140px 80px 1fr}.event>:last-child{grid-column:3}}@media(max-width:760px){header{padding:15px 18px}.brand span{display:none}.shell{display:block}nav{padding:8px 12px;flex-direction:row;position:static}nav .nav-caption,nav small{display:none}nav button{padding:7px 13px}main{padding:22px 16px}.intro{display:block}h1{font-size:25px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(3){border-left:0;padding-left:0}.metric{padding-top:10px;padding-bottom:10px}.focus{grid-template-columns:1fr}.focus-side{border-left:0;border-top:1px solid #bfccc0}.toolbar input{width:100%;order:3}.project{grid-template-columns:1fr;padding:20px}.project>.date-cell,.project>.last-cell{grid-column:auto}.project .course{display:inline}.group{display:inline;margin-left:8px}.event{grid-template-columns:110px 1fr;gap:9px}.event>:last-child{grid-column:2}.event>:nth-child(3){grid-column:2}.dialog-body{grid-template-columns:1fr;padding:18px}.dialog-head{padding:18px}.sources{grid-column:1}.connection{font-size:10px}.dialog-aside{order:0}}
.coordination-box{margin:12px 0;padding:12px 0;border-top:1px solid var(--line);font-size:12px}.coordination-box p{margin:7px 0}.decision{padding:12px 0;border-top:1px solid var(--line)}.decision ul{padding-left:18px;font-size:12px}.dialog-aside .coordination-box{margin-top:0;padding-top:0;border-top:0}
</style>
</head>
<body>
<header><div class="brand">CityU <span>学期行动室 / 2026 SEM A</span></div><div id="connection" class="connection" role="status">正在连接本地元数据</div></header>
<div class="shell"><nav aria-label="看板视图"><div class="nav-caption">ASSIGNMENT DESK</div><button class="active" data-view="overview">项目总览</button><button data-view="timeline">交付时间线</button><button data-view="questions">需要确认</button><button data-view="coordination">会话协作</button><small>本地文件驱动<br>每 5 秒刷新<br>统一使用香港时间<br><br>制作 / 提交分开记录</small></nav>
<main><div class="intro"><div><div class="eyebrow">FROM PROGRESS TO ACTION</div><h1>让下一步，一目了然。</h1><p>先看最近交付，再处理真正卡住的事。每条进度都保留依据，未知状态等待确认。</p></div><div class="stamp" id="stamp"></div></div>
<div id="errors" role="alert"></div><div class="metrics" id="metrics"></div><div id="focus"></div>
<div class="toolbar"><div class="filters" id="filters" aria-label="课程筛选"></div><label><span class="field-label">范围 </span><select id="scope"><option value="active">当前小组项目</option><option value="all">全部已登记作业</option><option value="intake">待补充元数据内容</option><option value="archived">历史归档</option></select></label><input id="search" type="search" placeholder="查课程、负责人或任务" aria-label="搜索作业"></div>
<div id="content"></div><p class="footer-note">完成数仅统计已登记且有依据的任务。完整任务范围尚未确认时，不显示整体完成百分比。<br>自动刷新读取本地 assignment.json；课程会话写回的进度和待决策事项自动进入看板；群聊、Canvas、Notion 新信息仍需核实。总监督仅在活跃回合接收和核查回传。</p>
</main></div>
<dialog id="detail"><div id="detail-content"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={done:'已完成',in_progress:'进行中',todo:'待做',blocked:'受阻',unknown:'待确认',submitted:'已提交',graded:'已评分',not_submitted:'未提交'};
let state=null, view='overview', course='all', query='', scope='active', detailId=null, signature='', connected=false;
const active=()=>state.assignments.filter(r=>r.board_scope==='active');
const ordered=records=>[...records].sort((a,b)=>key(next(a)).localeCompare(key(next(b))));
const key=m=>m?.due||'9999';
const next=r=>[...r.milestones].filter(m=>m.kind!=='internal'&&!['done','submitted'].includes(m.status)&&m.due).sort((a,b)=>key(a).localeCompare(key(b)))[0];
function dateLabel(m){if(!m?.due)return '日期待确认';const d=m.due.slice(0,10).replace('2026-','').replace('-',' / ');return d+(m.precision==='before_date'?' 前':m.precision==='datetime'?' · '+m.due.slice(11,16):'');}
function filtered(){return ordered(state.assignments.filter(r=>(scope==='all'||r.board_scope===scope)&&(course==='all'||r.course===course)&&(!query||JSON.stringify([r.title,r.course,r.my_role,r.summary,r.tasks,r.next_action]).toLowerCase().includes(query.toLowerCase()))));}
function openDetail(id){detailId=id;renderDetail();if(!$('detail').open)$('detail').showModal();}
function sourceLabel(r,ids){return ids.map(id=>r.sources.find(s=>s.id===id)?.label||id).join('；');}
const coordinationLabels={dispatched:'已派出',working:'正在推进',waiting_user:'需要你决定',ready_for_review:'已回传 · 待监督',blocked:'遇到阻塞',complete:'本阶段完成'};
function coordinationBlock(r,compact=false){const c=r.coordination;if(!c)return '';const pending=c.decisions.filter(d=>d.status==='pending');
return `<section class="coordination-box"><div class="field-label">课程独立会话 · ${esc(c.status==='ready_for_review'&&c.review_status?.startsWith('已核对本阶段')?'已回传 · 已核对':coordinationLabels[c.status]||c.status)}</div><a href="codex://threads/${encodeURIComponent(c.thread_id)}">${esc(c.title||r.course+' 课程会话')} ↗</a>${c.report_exists?` · <a href="/report/${encodeURIComponent(r.id)}" target="_blank" rel="noopener">阅读阶段报告</a>`:''}<p class="next">${esc(c.summary)}</p><div class="evidence-note">最后阶段回报：${esc(c.updated_at)} · ${esc(c.model)}<br>${esc(c.review_status||'尚未监督核对')}${c.review_note?' · '+esc(c.review_note):''}</div>${compact?(pending.length?`<span class="tag warn">${pending.length} 项等待你决定</span>`:''):c.decisions.map(d=>`<div class="decision"><b>${esc(d.id)} · ${esc(d.question)}</b><p>建议：${esc(d.recommendation)}</p>${d.options.length?`<ul>${d.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:''}${d.status==='decided'?`<p class="tag good">本人已决定：${esc(d.answer)}</p><div class="evidence-note">${esc(d.answer_source)}</div>`:'<p class="tag warn">待本人回答 · 可在课程会话或总监督会话回复</p>'}</div>`).join('')}</section>`;}
function renderDetail(){const r=state.assignments.find(r=>r.id===detailId);if(!r){$('detail').close();return;}
 $('detail-content').innerHTML=`<div class="dialog-head"><div><div class="eyebrow">${esc(r.course)} / ${esc(r.group||'组别未登记')}</div><h2>${esc(r.title)}</h2><span class="tag">${esc(r.stage)}</span><span class="tag">制作记录截至 ${esc(r.progress_as_of||'未核实')}</span></div><button class="close" aria-label="关闭详情">×</button></div><div class="dialog-body"><div><section><h3>当前判断</h3><p>${esc(r.summary)}</p><p><b>我的角色：</b>${esc(r.my_role||'尚未确认')}</p></section><section><h3>任务与交付证据</h3><p class="evidence-note">${r.task_scope_complete?'任务范围已锁定；百分比按任务等权计数。':'以下是已登记追踪项，完整工作量待团队确认。'}</p>${r.tasks.length?r.tasks.map(t=>`<div class="task"><div class="task-top"><span class="status ${esc(t.status)}">${labels[t.status]}</span><span>${esc(t.title)}</span></div><p>负责人：${esc(t.owner||'待确认')}${t.note?' · '+esc(t.note):''}</p>${t.evidence.length?`<p>依据：${esc(sourceLabel(r,t.evidence))}</p>`:''}</div>`).join(''):'<p class="evidence-note">本轮仅建立入口，尚未核实任务清单。</p>'}</section><section><h3>交付节点</h3>${r.milestones.map(m=>`<div class="task"><b>${esc(dateLabel(m))}</b> · ${esc(m.title)}<p style="margin-left:0">${esc(m.channel)} · ${esc(m.urgency)}<br>${m.precision==='date'||m.precision==='before_date'?'原始记录未注明具体时刻；':''}状态：${labels[m.status]}<br>依据：${esc(sourceLabel(r,m.evidence))}</p></div>`).join('')}</section></div><aside class="dialog-aside">${coordinationBlock(r)}<div class="eyebrow">NEXT ACTION · 建议行动</div><p>${esc(r.next_action.title)}</p><span class="evidence-note">行动负责人：${esc(r.next_action.owner||'待确认')} · ${r.next_action.basis==='agreed'?'已确认安排':'监督建议，尚未登记为组内承诺'}</span><h3>阻塞与待确认</h3><ul>${[...r.blockers,...r.warnings].map(x=>`<li>${esc(x)}</li>`).join('')||'<li>暂无已登记阻塞</li>'}</ul><h3>提交状态 · ${labels[r.submission.status]}</h3><p>${esc(r.submission.note)}</p><h3>数据新鲜度</h3><p>信息核查：${esc(r.reviewed_at)}<br>制作状态：${esc(r.progress_as_of||'未核实')}<br>元数据更新时间：${esc(r.updated_at)}</p><h3>元数据位置</h3><div class="metadata">${esc(r.metadata_path)}</div><p class="evidence-note">更新这份文件即可进入看板。服务只读，不修改作业或提交状态。</p></aside><section class="sources"><h3>证据与来源</h3>${r.sources.map(s=>`<div class="source"><b>${esc(s.label)}</b> · ${esc(s.observed_at)}${s.kind==='thread'?` · <a href="codex://threads/${encodeURIComponent(s.locator)}">查看会话</a>`:s.kind==='web'&&/^https:\/\//.test(s.locator)?` · <a href="${esc(s.locator)}" target="_blank" rel="noopener noreferrer">打开来源</a>`:''}<code>${esc(s.locator)}</code></div>`).join('')}</section></div>`;
 $('detail-content').querySelector('.close').onclick=()=>{$('detail').close();detailId=null;};
}
function project(r){const m=next(r),n=r.tasks.length,done=r.counts.done;return `<article class="project"><div><div class="course">${esc(r.course)}</div><div class="group">${esc(r.group||r.id)}</div></div><div><button class="title-button" data-detail="${esc(r.id)}">${esc(r.title)}</button><p class="summary">${esc(r.summary)}</p>${coordinationBlock(r,true)}<span class="tag">${esc(r.stage)}</span>${r.warnings.length?'<span class="tag warn">信息需更新</span>':''}<div class="progress-line" aria-hidden="true">${r.tasks.map(t=>`<i class="${esc(t.status)}"></i>`).join('')}</div><div class="counts">${n?`已确认完成 ${done} / ${n} 个追踪项 · ${r.counts.unknown} 项状态待确认${r.completion_percent!==null?' · '+r.completion_percent+'%（等权）':''}`:'任务和提交状态尚未核实'}</div></div><div><div class="field-label">建议下一步</div><div class="next">${esc(r.next_action.title)}</div><div class="group">${esc(r.my_role||'本人分工待确认')}</div></div><div class="date-cell"><div class="field-label">最近交付</div><div class="deadline">${esc(dateLabel(m))}</div><div class="deadline-label">${esc(m?.title||'尚未登记截止')}</div>${m?`<span class="tag ${m.urgency==='计划中'?'':'warn'}">${esc(m.urgency)}</span>`:''}<div class="group">提交：${labels[r.submission.status]}</div></div><div class="last-cell"><button class="details-btn" data-detail="${esc(r.id)}">查看详情 ↗</button><div class="group" style="margin-top:10px">进度记录<br>${esc(r.progress_as_of||'待核实')}</div></div></article>`;}
function render(){if(!state)return;const a=active(), allEvents=a.flatMap(r=>r.milestones.map(m=>({...m,course:r.course,assignment:r.id}))), unknown=a.filter(r=>r.tasks.some(t=>t.status==='unknown'));
 $('metrics').innerHTML=`<div class="metric"><strong>${a.length}</strong><span>当前小组项目</span><small>${new Set(a.map(r=>r.course)).size} 门课程，分别推进</small></div><div class="metric"><strong>${allEvents.filter(m=>m.kind==='submission').length}</strong><span>交件节点</span><small>展示场次单独登记</small></div><div class="metric"><strong>${unknown.length}</strong><span>项目有待确认进度</span><small>未知不等于尚未开始</small></div><div class="metric"><strong>${state.assignments.length}</strong><span>已建立元数据入口</span><small>${state.assignments.filter(r=>r.board_scope==='intake').length} 份待补充内容 · ${state.errors.length} 项读取错误</small></div>`;
 const first=ordered(a)[0], soon=first&&next(first);$('focus').innerHTML=view==='overview'&&first?`<section class="focus"><div class="focus-main"><div class="eyebrow">最近交付 / ${esc(first.course)}</div><h2>${esc(dateLabel(soon))}，${esc(soon?.title||'确认交付安排')}</h2><p>${esc(first.next_action.title)}</p><button class="plain-btn" data-detail="${esc(first.id)}">展开任务与证据 →</button></div><div class="focus-side"><div class="eyebrow">统筹关注</div><p>优先解决截止冲突、分工不明和长期未更新。</p><p class="evidence-note">${esc(a.flatMap(r=>r.warnings.map(w=>r.course+"："+w)).concat(a.flatMap(r=>r.blockers.slice(0,1).map(w=>r.course+"："+w))).slice(0,2).join("；") || "暂无已登记的新鲜度警告或阻塞。")}</p></div></section>`:'';
 $('errors').innerHTML=state.errors.map(e=>`<div class="alert">读取失败：${esc(e.path)}<br>${esc(e.message)}。该作业未计入当前数据，请先修复；不能将其理解为已完成。</div>`).join('')+state.missing.map(p=>`<div class="alert">未接入元数据：${esc(p)} / assignment.json</div>`).join('');
 $('filters').innerHTML=['all',...new Set(state.assignments.map(r=>r.course))].map(c=>`<button data-course="${c}" class="${course===c?'active':''}">${c==='all'?'全部课程':c}</button>`).join('');
 const records=filtered();
 if(view==='overview')$('content').innerHTML=`<div class="project-list">${records.map(project).join('')||'<div class="empty">当前筛选没有匹配作业。</div>'}</div>`;
 if(view==='timeline'){const events=records.flatMap(r=>r.milestones.map(m=>({...m,course:r.course,assignment:r.id}))).sort((a,b)=>key(a).localeCompare(key(b)));$('content').innerHTML=`<h2>交付与展示 · 香港时间</h2><div class="timeline">${events.map(m=>`<div class="event"><b>${esc(dateLabel(m))}</b><span class="course">${esc(m.course)}</span><div><button class="title-button" data-detail="${esc(m.assignment)}">${esc(m.title)}</button><small>${esc(m.channel)} · ${m.kind==='presentation'?'展示场次':'交件截止'}</small></div><div><span class="tag">${esc(m.urgency)}</span><small>状态：${labels[m.status]}</small></div></div>`).join('')||'<div class="empty">该范围尚无已登记节点。</div>'}</div>`;}
 if(view==='questions')$('content').innerHTML=`<h2>把信息缺口变成可回答的问题</h2>${records.filter(r=>r.blockers.length||r.warnings.length||r.board_scope==='intake'||r.coordination?.decisions.some(d=>d.status==='pending')).map(r=>`<article class="question-row"><button class="title-button" data-detail="${esc(r.id)}">${esc(r.course)} · ${esc(r.title)}</button>${coordinationBlock(r)}<ul>${[...r.blockers,...r.warnings,...(r.board_scope==='intake'?['任务、负责人及提交状态尚未核实']:[])].map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="next">建议行动：${esc(r.next_action.title)}</div></article>`).join('')}`;
 if(view==='coordination')$('content').innerHTML=`<h2>课程独立推进 · 总会话统筹</h2><p class="evidence-note">派出 → 课程推进 → 阶段回传 → 总监督核对 → 看板更新。你可在任一会话给出决定。以下为最后回报状态，不代表实时模型运行状态。</p>${records.filter(r=>r.coordination).map(r=>`<article class="question-row"><h3>${esc(r.course)} · ${esc(r.title)}</h3>${coordinationBlock(r)}</article>`).join('')||'<p class="empty">当前筛选没有新派出的课程会话。</p>'}`;
 document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail));
 document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{course=b.dataset.course;render();});
 if(detailId&&$('detail').open)renderDetail();
}
async function refresh(){try{const response=await fetch('/api/assignments',{cache:'no-store',signal:AbortSignal.timeout(4500)});if(!response.ok)throw Error(response.status);const data=await response.json();const sig=JSON.stringify([data.assignments,data.errors,data.missing]);state=data;connected=true;$('connection').className='connection';$('connection').innerHTML=`本地已连接 · 每 5 秒读取<button id="refresh">立即刷新</button>`;$('refresh').onclick=refresh;$('stamp').textContent='最近读取 '+new Date(data.generated_at).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});if(sig!==signature){signature=sig;render();}}catch(e){connected=false;$('connection').className='connection error';$('connection').textContent='连接中断 · 当前为最后成功快照，非实时';if(!state)$('errors').innerHTML='<div class="alert">无法读取本地服务。请运行 _meta/assignment-board/start.cmd，再刷新页面。</div>';}}
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(n=>n.classList.toggle('active',n===b));render();});
 $('scope').onchange=e=>{scope=e.target.value;render();};$('search').oninput=e=>{query=e.target.value;render();};$('detail').addEventListener('close',()=>detailId=null);
 refresh();setInterval(refresh,5000);
</script>
</body></html>
