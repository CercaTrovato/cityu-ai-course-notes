<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>AC6761 M10 frozen v1 acceptance</title>
<link rel="stylesheet" href="/katex.css"><style>body{font-family:"Microsoft YaHei",sans-serif;font-size:16px;line-height:1.75;color:#202124;margin:0;background:#fff}main{width:900px;max-width:calc(100% - 64px);margin:32px auto}h1,h2,h3,h4{line-height:1.4;margin-top:2em}table{border-collapse:collapse;width:100%;font-size:16px;margin:20px 0}td,th{border:1px solid #bbb;padding:10px;vertical-align:top;overflow-wrap:anywhere}th{background:#f4f5f6;text-align:left}blockquote{border-left:3px solid #aaa;margin:18px 0;padding:2px 18px}pre{white-space:pre-wrap}.mermaid{text-align:center;margin:24px 0}.mermaid svg{max-width:100%;height:auto}code{font-family:Consolas,monospace}p{margin:15px 0}summary{cursor:pointer} .katex{font-size:1.05em}</style>
<main id="content"></main><script src="/marked.js"></script><script src="/katex.js"></script><script src="/auto-render.js"></script><script src="/mermaid.js"></script>
<script>
window.previewReady=false;window.addEventListener('hashchange',()=>{document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView()});
(async()=>{let raw=await(await fetch('/candidate.md')).text();window.rawCandidate=raw;raw=raw.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/,'');let maths=[];raw=raw.replace(/\$\$[\s\S]*?\$\$|\$[^$\n]+\$/g,m=>{maths.push(m);return 'MATHPLACEHOLDER'+(maths.length-1)+'END'});raw=raw.replace(/\[\[([^\]]+)\]\]/g,(_,s)=>s.replace(/\\\|/g,'|').split('|').pop());document.querySelector('#content').innerHTML=marked.parse(raw);document.querySelectorAll('pre code.language-mermaid').forEach((c,i)=>{let d=document.createElement('div');d.className='mermaid';d.id='figure-'+(i+1);d.textContent=c.textContent;c.parentElement.replaceWith(d)});let html=document.querySelector('#content').innerHTML.replace(/MATHPLACEHOLDER(\d+)END/g,(_,i)=>maths[+i]);document.querySelector('#content').innerHTML=html;mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'default',flowchart:{useMaxWidth:true},themeVariables:{fontFamily:'Microsoft YaHei',fontSize:'16px'}});try{await mermaid.run({querySelector:'.mermaid'});renderMathInElement(document.querySelector('#content'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});document.querySelectorAll("h1,h2,h3,h4").forEach(h=>{let m=h.textContent.match(/^([0-9.]+)/);if(m)h.id="h-"+m[1].replaceAll(".","-").replace(/-$/,"")});window.previewReady=true}catch(e){window.previewError=String(e)}})();
</script></html>
