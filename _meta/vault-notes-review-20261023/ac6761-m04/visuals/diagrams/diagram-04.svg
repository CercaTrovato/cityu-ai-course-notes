width="200" height="204"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>② 逻辑模型 Logical Model<br>触发条件：决定了数据库<b>类型</b><br>（关系型 / 面向对象 / 层次 / 网状）<br>（本讲 §2.9–2.10：关系表与外键）</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-P-2" transform="translate(138, 642)"><rect class="basic label-container" style="" x="-130" y="-91.5" width="260" height="183"></rect><g class="label" style="" transform="translate(-100, -76.5)"><rect></rect><foreignObject width="200" height="153"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>③ 物理数据库模型 Physical Model<br>触发条件：决定了具体<b>软件</b><br>数据类型、索引、存储<br>（W6：ACCESS 上机）</p></span></div></foreignObject></g></g></g></g></g></svg>